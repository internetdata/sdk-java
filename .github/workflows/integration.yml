name: Integration

# Exercises the library as PUBLISHED on Maven Central, against staging. CI covers
# this working tree; nothing there would notice a tag that was never pushed, a jar
# that shipped without a package, or a release that never landed.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    # Off the hour on purpose: scheduled runs bunched at :00 are queued behind
    # everyone else's and can be dropped entirely under load.
    - cron: '43 6 * * *'

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # No dependency cache: the point is the resolve a stranger gets. The script
      # skips with a reason when nothing is published yet, and again when the key
      # is missing - every endpoint here is licensed, so there is no
      # unauthenticated half worth running.
      #
      # A secret that does not exist interpolates to an empty string, which the
      # runner treats as absent.
      - run: ./scripts/run.sh
        working-directory: integration
        env:
          INTERNETDATA_STAGING_KEY: ${{ secrets.INTERNETDATA_STAGING_KEY }}
